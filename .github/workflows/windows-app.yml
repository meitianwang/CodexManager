name: Windows App

on:
  pull_request:
    paths:
      - ".github/workflows/windows-app.yml"
      - "apps/windows/**"
      - "docs/release-windows.md"
      - "scripts/collect_windows_verification.ps1"
      - "scripts/package_windows.ps1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-app.yml"
      - "apps/windows/**"
      - "docs/release-windows.md"
      - "scripts/collect_windows_verification.ps1"
      - "scripts/package_windows.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Windows verification script syntax
        shell: pwsh
        run: |
          $Errors = $null
          [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw .\scripts\collect_windows_verification.ps1), [ref] $Errors) | Out-Null
          if ($Errors) {
            $Errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/windows/pnpm-lock.yaml

      - name: Install Windows app dependencies
        working-directory: apps/windows
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, build, and make Squirrel installer
        shell: pwsh
        run: .\scripts\package_windows.ps1 -Target make -Arch x64 -SkipInstall

      - name: Smoke test packaged Windows app
        shell: pwsh
        run: |
          $ExePath = Join-Path $PWD "apps/windows/out/CodexManager-win32-x64/CodexManager.exe"
          if (-not (Test-Path $ExePath)) {
            throw "Packaged app executable was not found: $ExePath"
          }

          $SmokeRoot = Join-Path $env:RUNNER_TEMP "codexmanager-smoke"
          $env:APPDATA = Join-Path $SmokeRoot "AppDataRoaming"
          $env:USERPROFILE = Join-Path $SmokeRoot "UserProfile"
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:USERPROFILE | Out-Null
          $ResultPath = Join-Path $SmokeRoot "smoke-result.json"

          $env:CODEX_MANAGER_ELECTRON_SMOKE_TEST = "1"
          $env:CODEX_MANAGER_ELECTRON_SMOKE_ROOT = $SmokeRoot
          $env:CODEX_MANAGER_ELECTRON_SMOKE_TIMEOUT_MS = "45000"
          $env:CODEX_MANAGER_ELECTRON_SMOKE_RESULT_PATH = $ResultPath
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $Process = Start-Process -FilePath $ExePath -ArgumentList "--user-data-dir=$SmokeRoot\UserData" -Wait -PassThru
          if ($Process.ExitCode -ne 0) {
            throw "Packaged app smoke test exited with code $($Process.ExitCode)"
          }
          if (-not (Test-Path $ResultPath)) {
            throw "Packaged app smoke test did not write a result file: $ResultPath"
          }

          $Result = Get-Content -Raw $ResultPath | ConvertFrom-Json
          $InvalidSmokeResult = @(
            $Result.status -ne "passed"
            -not ([bool]$Result.state.hasBridge)
            $Result.state.activePage -ne "accounts"
            -not ([bool]$Result.workflows.proxyHealthOK)
            $Result.workflows.proxyPort -le 0
            $Result.workflows.proxyUnauthorizedStatus -ne 401
            $Result.workflows.settingsLocale -ne "en"
            $Result.workflows.switchedAccountId -ne "acct-smoke"
          ) -contains $true
          if ($InvalidSmokeResult) {
            throw "Packaged app smoke test returned an invalid result: $(Get-Content -Raw $ResultPath)"
          }
          Write-Host "CodexManager Windows smoke test passed: $(Get-Content -Raw $ResultPath)"

      - name: Upload Squirrel.Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexManager-Windows-x64-Squirrel
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/windows/out/make/squirrel.windows/x64/CodexManagerSetup.exe
            apps/windows/out/make/squirrel.windows/x64/*.nupkg
            apps/windows/out/make/squirrel.windows/x64/RELEASES
