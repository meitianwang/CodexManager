name: CodexManager
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  CodexManager:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/CodexManager
        excludes:
          - "Resources/LaunchScreen.storyboard"
    resources:
      - path: Sources/CodexManager/Resources
    settings:
      base:
        PRODUCT_NAME: CodexManager
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleName: CodexManager
        INFOPLIST_KEY_CFBundleDisplayName: CodexManager
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 8
        MARKETING_VERSION: 1.0.10
        DEVELOPMENT_TEAM: KLU8GF65GP
        PRODUCT_BUNDLE_IDENTIFIER: com.nik.mei.codexmanager
    postBuildScripts:
      - name: "Inject Bundle Metadata"
        script: |
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string AppIcon" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile AppIcon" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" "$PLIST"
  CodexManagerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/CodexManagerTests
    dependencies:
      - target: CodexManager
schemes:
  CodexManager:
    build:
      targets:
        CodexManager: all
        CodexManagerTests: [test]
    test:
      targets:
        - CodexManagerTests
